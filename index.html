<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/title.css">
    <link rel="stylesheet" href="style/card.css">
    <link rel="stylesheet" href="style/products.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">>
</head>
<body>
    <button id="change-color-all-card-button">Сменить цвет карточек</button>
    <button id="change-first-color-card-button">Сменить цвет первой карточки</button>
    <button id="open-google">Открыть страницу Google.com</button>
    <button id="output-console-log">Вывести сообщение в консоль лог</button>
    <button id="toggle-button">Кнопка смены цвета</button>
    <div class="products-conteiner bg-image">
        <h1 class="title">Выбери свой продукт</h1>
        <ul class="product-list" class="card">

        <template id="product-card-template">
            <li class="card">
                <img src="" alt="" class="card__image"/>
                <span class="card__tags"></span>
                <h2 class="card__name"></h2>
                <p class="card__description"></p>
                <span>Состав: </span>
                <ul class="card__ingridients"></ul>
                <div class="card__price">
                    <span class="card__price__label">Цена:</span>
                    <span class="card__price__value"></span>
                </div>
            </li>
        </template>
        </ul>
    </div>

    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script src="homework-9.js" type="module"></script>
    <script src="homework-10.js" type="module"></script>
</body>
</html>

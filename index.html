<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/title.css">
    <link rel="stylesheet" href="style/card.css">
    <link rel="stylesheet" href="style/products.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">>
</head>
<body>
    <button id="change-color-all-card-button">Сменить цвет карточек</button>
    <button id="change-first-color-card-button">Сменить цвет первой карточки</button>
    <button id="open-google">Открыть страницу Google.com</button>
    <button id="output-console-log">Вывести сообщение в консоль лог</button>
    <button id="toggle-button">Кнопка смены цвета</button>
    <div class="products-conteiner bg-image">
        <h1 class="title">Выбери свой продукт</h1>
        <ul class="product-list" class="card">

        <template id="product-card-template">
            <li class="card">
                <img src="" alt="" class="card__image"/>
                <span class="card__tags"></span>
                <h2 class="card__name"></h2>
                <p class="card__description"></p>
                <span>Состав: </span>
                <ul class="card__ingridients"></ul>
                <div class="card__price">
                    <span class="card__price__label">Цена:</span>
                    <span class="card__price__value"></span>
                </div>
            </li>
        </template>
        </ul>
    </div>

    <footer class="footer">
        <div class="footer__conteiner">

            <div class="footer__about">
                <h2 class="footer__logo">Product Cards</h2>
                <p class="footer__text">У Нас Самые Лучшие Продукты Для Кожи!</p>
                <div class="footer__socials">

                    <a class="footer__social__link" href="#" target="_blank">
                        <img class="footer__social__icon" src="img/telegram.png">
                    </a>

                    <a class="footer__social__link" href="#" target="_blank">
                        <img class="footer__social__icon" src="img/vk.png">
                    </a>

                </div>
            </div>

            <div class="footer__subscribe">
                <label for="footer-email" class="footer__label">Подпишись на наши акции:</label>
                <form id="footer-form-center">
                    <input type="email" id="footer-email" name="userEmail" required class="footer__form__input" placeholder="Введи Email...">
                    <button type="submit" id="footer-button">Подписаться</button>
                    <p id="subscribe-error" class="error__message"></p>
                </form>
                <button id="reg-button" class="reg__button">Регистрация</button>
            </div>
            
            <div class="footer__nav">
                <h3 class="footer__nav__title">Быстрые ссылки</h3>
                <nav>
                    <ul class="footer__nav__list">
                        <li class="footer__nav__item">
                            <a href="#">Главная</a>
                        </li>
                        <li class="footer__nav__item">
                            <a href="#">Магазин</a>
                        </li>
                        <li class="footer__nav__item">
                            <a href="#">Контакты</a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="footer__bottom">
                <p>www.product-cards.com©all rights reserved</p>
            </div>

        </div>
    </footer>

    <div id="modal-overlay" class="modal__overlay">
        <div class="modal__window">
            <button id="close-modal-button" class="close__button">&times;</button>

            <form id="registration-form">
                <h3>Регистрация</h3>
                <input type="text" placeholder="Имя" name="name" required>
                <input type="text" placeholder="Фамилия" name="surName" required>
                <input type="date" placeholder="Дата рождения" name="dateOfBirth" required>
                <input type="text" placeholder="Логин" name="login" required>
                <input type="password" id="reg-password" placeholder="Пароль" name="password" required>
                <input type="password" id="reg-confirm" placeholder="Повторите пароль" name="passwordConfirm" required>
                <p id="reg-error" class="error__message"></p>
                <button type="submit" class="button__submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script src="homework-9.js" type="module"></script>
    <script src="homework-10.js" type="module"></script>
    <script src="homework-11.js" type="module"></script>
</body>
</html>
